name: Release

# Downloadable builds of nn-server and nn-generator.
#
# Push a tag matching the workspace version (Cargo.toml) to publish:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every platform builds, packages and smoke-tests, then a *draft* GitHub
# release collects the archives and SHA256SUMS.txt; check it and press
# Publish. A tag with a hyphen (v0.2.0-rc.1) makes a pre-release.
# Pull requests that touch this workflow or packaging/ build the archives
# (as workflow artifacts) without releasing anything.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .cargo/**
      - packaging/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static (musl): runs on any x86_64 Linux, old lab distributions too.
          - name: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            archive: zip
          # One universal binary for Apple Silicon and Intel Macs.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Add targets
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do rustup target add "$t"; done
          if [[ "${{ matrix.targets }}" == *musl* ]]; then
            sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the workspace version $version (Cargo.toml)"
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$t" -p nn-server -p nn-generator
          done
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          name="networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          dir="dist/$name"
          mkdir -p "$dir"
          targets=(${{ matrix.targets }})
          ext=""
          [[ "${{ matrix.os }}" == windows-* ]] && ext=".exe"
          for bin in nn-server nn-generator; do
            if (( ${#targets[@]} > 1 )); then
              lipo -create -output "$dir/$bin" $(for t in "${targets[@]}"; do echo "target/$t/release/$bin"; done)
            else
              cp "target/${targets[0]}/release/$bin$ext" "$dir/"
            fi
          done
          cp packaging/QUICKSTART.md README.md LICENSE NOTICE nn.example.toml "$dir/"
          cp -r rulepacks "$dir/"
      # Developer ID signing and Apple notarization, so Gatekeeper opens the
      # binaries without a warning (packaging/SIGNING.md). Until the secrets
      # are set the Mac build stays unsigned, with a warning on the run.
      - name: Sign and notarize (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dir="dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "::warning::macOS signing secrets aren't set: this Mac build is unsigned, and testers will see Apple's warning (packaging/SIGNING.md)"
            exit 0
          fi
          bash packaging/macos-sign.sh "$dir"
      # The version resource code signing checks (packaging/winres.rs).
      - name: Check version info (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $dir = "dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          foreach ($b in "nn-server.exe", "nn-generator.exe") {
            $v = (Get-Item "$dir/$b").VersionInfo
            "$b : $($v.ProductName) $($v.ProductVersion), $($v.FileDescription)"
            if ($v.ProductName -ne "NetworkNinja" -or $v.ProductVersion -ne "${{ steps.version.outputs.version }}") {
              throw "$b doesn't carry the NetworkNinja version resource"
            }
          }
      # Authenticode signing by SignPath Foundation (packaging/SIGNING.md):
      # tags use the release-signing policy, which waits for a person to
      # approve the request in SignPath; other runs use test-signing. Until
      # the secret and variable are set the Windows build stays unsigned,
      # with a warning on the run.
      - name: Signing setup (Windows)
        id: winsign
        if: startsWith(matrix.os, 'windows')
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [[ -z "$SIGNPATH_API_TOKEN" || -z "$SIGNPATH_ORGANIZATION_ID" ]]; then
            echo "::warning::SignPath isn't set up: this Windows build is unsigned, and SmartScreen will warn testers (packaging/SIGNING.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "policy=release-signing" >> "$GITHUB_OUTPUT"
          else
            echo "policy=test-signing" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        id: unsigned
        if: steps.winsign.outputs.enabled == 'true'
        with:
          name: windows-unsigned
          path: |
            dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}/nn-server.exe
            dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}/nn-generator.exe
          if-no-files-found: error
      - name: Sign (Windows)
        if: steps.winsign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'NetworkNinja' }}
          signing-policy-slug: ${{ steps.winsign.outputs.policy }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          # Time to approve a release-signing request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}
      - name: Check signature (Windows)
        if: steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $dir = "dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          foreach ($b in "nn-server.exe", "nn-generator.exe") {
            $s = Get-AuthenticodeSignature "$dir/$b"
            "$b : $($s.Status), $($s.SignerCertificate.Subject)"
            # Test-signing certificates aren't trusted; a release must be.
            if ("${{ steps.winsign.outputs.policy }}" -eq "release-signing" -and $s.Status -ne "Valid") {
              throw "$b isn't validly signed"
            }
            if (-not $s.SignerCertificate) { throw "$b isn't signed" }
          }
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name="networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          dir="dist/$name"
          ext=""
          [[ "${{ matrix.os }}" == windows-* ]] && ext=".exe"
          # Smoke test: the packaged binaries start on this runner.
          "$dir/nn-server$ext" --version
          "$dir/nn-generator$ext" --help > /dev/null
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip -bso0 "$name.zip" "$name"
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          cat "$file.sha256"
      # Nothing to install: each binary needs only what its OS ships (no
      # Visual C++ Redistributable, no Homebrew libraries, no shared libs on
      # Linux). Fails the build otherwise.
      - name: Check runtime dependencies
        shell: bash
        run: |
          dir="dist/networkninja-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          py=$(command -v python3 || command -v python)
          "$py" packaging/check-deps.py "$dir"
          # The Intel half of the macOS build, under Rosetta where the runner has it.
          if [[ "${{ matrix.os }}" == macos-* ]] && arch -x86_64 /usr/bin/true 2> /dev/null; then
            arch -x86_64 "$dir/nn-server" --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --draft $pre --generate-notes --title "NetworkNinja $GITHUB_REF_NAME" \
            --notes "Unpack an archive and follow its QUICKSTART.md; check downloads against SHA256SUMS.txt. [Code signing policy](https://github.com/wsustone/NetworkNinja#code-signing-policy)."
