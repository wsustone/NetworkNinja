<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetworkNinja</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --crit:#f85149; --warn:#d29922; --ok:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  header { display:flex; gap:1em; align-items:center; padding:.6em 1em; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:16px; letter-spacing:.5px; }
  .stat { color:var(--dim); } .stat b { color:var(--fg); }
  #conn.ws { color:var(--ok); } #conn.poll { color:var(--warn); } #conn.down { color:var(--crit); }
  .frozen { color:var(--warn); font-weight:600; }
  main { display:grid; grid-template-columns: 200px 1fr 380px; gap:1em; padding:1em; }
  #sidebar { grid-row:1/3; }
  #sidelist { list-style:none; margin:0; padding:0; font-size:12px; }
  #sidelist li { padding:.35em .6em; cursor:pointer; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sidelist li:hover { background:#21262d; }
  #sidelist li.sel { background:#1f6feb44; }
  #sidelist .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  #sidelist .id { color:var(--dim); font-size:10px; float:right; }
  /* Tablet: sidebar becomes a horizontal strip; map spans the full width. */
  @media (max-width:1100px) {
    main { grid-template-columns:1fr 340px; }
    #sidebar { grid-column:1/-1; grid-row:auto; }
    #sidelist { display:flex; overflow-x:auto; gap:2px; }
    #sidelist li { flex:none; }
    #map { grid-column:1/-1; }
  }
  /* Phone: single column, capped panels, bigger tap targets. */
  @media (max-width:700px) {
    main { grid-template-columns:1fr; padding:.5em; gap:.5em; }
    header { font-size:12px; padding:.4em .6em; gap:.4em 1em; }
    #sidebar { grid-row:auto; }
    .tablewrap { overflow-x:auto; max-height:55vh; }
    #map { height:260px; }
    #alerts { max-height:40vh; overflow-y:auto; }
    .albtn { padding:.35em .7em; font-size:12px; }
    th, td { padding:.3em .5em; }
    #filter, #efilter { padding:.55em .9em; font-size:14px; }
  }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  h2 { margin:0; padding:.6em .9em; font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); border-bottom:1px solid var(--line); }
  h2 span { float:right; font-weight:400; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:.35em .6em; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:11px; cursor:pointer; user-select:none; border-bottom:1px solid var(--line); }
  td { border-bottom:1px solid #21262d; }
  tbody tr.sel { background:#1f2d3d; }
  tr.stale td { color:var(--dim); }
  tr.removed td { color:var(--dim); text-decoration:line-through; }
  tr.frozen td:last-child { color:var(--warn); }
  ul#alerts { list-style:none; margin:0; padding:0; max-height:70vh; overflow-y:auto; }
  #alerts li { padding:.5em .9em; border-bottom:1px solid #21262d; cursor:pointer; font-size:13px; }
  #alerts li:hover { background:#1f2d3d; }
  #alerts li.crit { border-left:3px solid var(--crit); }
  #alerts li.warn { border-left:3px solid var(--warn); }
  #alerts li.res { border-left:3px solid var(--ok); opacity:.65; }
  #alerts li.err { border-left:3px solid var(--crit); background:#2d1f22; }
  #alerts li.info { border-left:3px solid var(--line); color:var(--dim); }
  #alerts .t { color:var(--dim); font-size:11px; }
  #alerts .r { color:var(--dim); font-size:11px; float:right; }
  .albtn { font-size:10px; padding:.1em .5em; margin-left:.5em; background:#21262d; color:var(--dim); border:1px solid var(--line); border-radius:3px; cursor:pointer; }
  .albtn:hover { color:var(--fg); border-color:var(--dim); }
  .acked { color:var(--ok); font-size:11px; }
  #tlrow { display:none; gap:.6em; align-items:center; padding:.35em 1em; background:var(--panel); border-bottom:1px solid var(--line); font-size:11px; color:var(--dim); }
  #tlrow.on { display:flex; }
  #seek { flex:1; accent-color:var(--ok); }
  #login { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:9; }
  #login.on { display:flex; }
  #login>div { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:2em; display:flex; flex-direction:column; gap:.8em; min-width:240px; }
  #login input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:.6em .8em; font:inherit; }
  #login button { background:var(--ok); color:#04140a; border:0; border-radius:4px; padding:.6em; font:inherit; font-weight:700; cursor:pointer; }
  #logout { background:none; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:.1em .5em; font:inherit; font-size:11px; cursor:pointer; }
  #lerr { color:var(--crit); font-size:12px; min-height:1em; }
  select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:3px; font:inherit; font-size:11px; padding:.15em .3em; }
  #filter, #efilter { width:100%; padding:.4em .9em; background:var(--bg); color:var(--fg); border:none; border-bottom:1px solid var(--line); outline:none; font:inherit; }
  #filter::placeholder, #efilter::placeholder { color:var(--dim); }
  .tablewrap { max-height:70vh; overflow:auto; position:relative; }
  .tablewrap.short { max-height:32vh; }
  tbody tr { cursor:pointer; }
  tbody tr:hover td { background:#1c2129; }
  #detail { border-top:1px solid var(--line); padding:.6em .9em .8em; font-size:12px; }
  #detail .dh { display:flex; gap:.7em; align-items:baseline; flex-wrap:wrap; margin-bottom:.5em; }
  #detail .dh b { font-size:15px; }
  #detail .dh .id { color:var(--dim); font-family:ui-monospace,monospace; }
  #detail .st { font-size:11px; padding:0 .55em; border-radius:9px; border:1px solid currentColor; }
  #detail .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:.2em 1.2em; }
  #detail .grid span { color:var(--dim); }
  #detail .grid div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #detail h3 { margin:.7em 0 .2em; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim); font-weight:500; }
  #detail table { font-size:11px; }
  #detail .conflict td { color:var(--crit); }
  #detail .al { padding:.2em 0; } #detail .al.crit b { color:var(--crit); } #detail .al.warn b { color:var(--warn); }
  #detail .acts { display:flex; gap:.4em; margin-left:auto; }
  #detail .acts .albtn { margin:0; font-size:11px; padding:.2em .6em; }
  #detail .gone { color:var(--warn); }
  .empty { padding:1em; color:var(--dim); }
  #map { grid-column:2 / -1; height:420px; position:relative; }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>

<header>
  <b>NetworkNinja</b>
  <span id="conn" class="down">connecting…</span>
  <span class="stat">exercise <b id="hEx">–</b></span>
  <span class="stat">entities <b id="hEnt">0</b></span>
  <span class="stat">PDU/s <b id="hRate">0</b></span>
  <span class="stat">errors <b id="hErr">0</b></span>
  <span class="stat">alerts <b id="hAlerts">0</b></span>
  <span class="stat" id="hFrozen"></span>
  <span class="stat">run <select id="runsel"><option value="">live</option></select></span>
  <span class="stat">speed <select id="pspeed"><option>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select></span>
  <span class="stat" style="margin-left:auto" id="hPacks"></span>
  <span class="stat" id="hUser" hidden><b id="hWho"></b> <button id="logout">sign out</button></span>
</header>
<div id="tlrow"><b>replay</b><span id="seekt">0:00</span><input type="range" id="seek" min="0" max="0" step="0.1"><span id="seekd">0:00</span></div>

<main>
  <section id="sidebar">
    <h2>Entities</h2>
    <ul id="sidelist"></ul>
  </section>
  <section>
    <h2>Entities <span id="eCount"></span></h2>
    <input id="efilter" placeholder="search: id, marking, type, site…">
    <div class="tablewrap"><table>
      <thead><tr>
        <th data-k="id">ID</th><th data-k="marking">Marking</th><th data-k="etype">Type</th>
        <th data-k="force">Force</th><th data-k="lat">Lat</th><th data-k="lon">Lon</th>
        <th data-k="speed">m/s</th><th data-k="age">Age</th><th data-k="senders">Src</th><th data-k="status">Status</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="detail" hidden></div>
  </section>
  <section>
    <h2>Event log <span id="aCount"></span></h2>
    <input id="filter" placeholder="filter: entity, rule, message…">
    <ul id="alerts"></ul>
  </section>
  <section id="map"></section>
</main>
<script src="/vendor/maplibre-gl.js"></script>

<div id="login"><div>
  <b>NetworkNinja</b>
  <input id="luser" placeholder="user" autocomplete="username">
  <input id="lpass" type="password" placeholder="password" autocomplete="current-password">
  <span id="lerr"></span>
  <button id="lgo">sign in</button>
</div></div>
<script>
"use strict";
let state = null, sortKey = "id", sortAsc = true, selected = null, seeded = false;
const $ = id => document.getElementById(id);
const seen = new Set();
const feed = [];

function fmtAge(a) { return a < 60 ? a.toFixed(0)+"s" : (a/60).toFixed(1)+"m"; }
function fmtT(s) { const m = Math.floor(s/60), r = Math.floor(s%60); return `${m}:${String(r).padStart(2,"0")}`; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function pushEntry(e, silent) {
  const k = e.seq ?? (e.kind + "|" + e.at + "|" + (e.entity||"") + "|" + (e.rule||"") + "|" + (e.state||""));
  if (seen.has(k)) return;
  seen.add(k);
  feed.push(e);
  if (feed.length > 2000) feed.shift();
  renderFeed();
  if (!silent && e.kind === "alert" && e.state === "firing" && e.severity === "critical") {
    document.title = "⚠ NetworkNinja";
    setTimeout(() => document.title = "NetworkNinja", 5000);
  }
}

function cmd(o) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
}

function entryHtml(e) {
  const t = new Date((e.at||0)*1000).toLocaleTimeString();
  if (e.kind === "alert") {
    const cls = e.state === "resolved" ? "res" : (e.severity === "critical" ? "crit" : "warn");
    const acked = e.state === "firing" && state && state.alerts.some(a => a.rule === e.rule && a.entity === e.entity && a.ack);
    const btns = e.state === "firing" && !acked
      ? `<button class="albtn" data-cmd="ack" data-rule="${esc(e.rule)}" data-ent="${esc(e.entity)}" data-ex="${e.exercise}">ack</button>`
        + `<button class="albtn" data-cmd="mute" data-ent="${esc(e.entity)}" data-ex="${e.exercise}" data-secs="300">mute 5m</button>`
      : "";
    const badge = acked ? ' <span class="acked">· acked</span>' : "";
    return {cls, ent: e.entity,
      html: `<span class="r">${esc(e.pack)}/${esc(e.rule)}</span><span class="t">${t} · ${e.state}${badge}</span><br><b>${esc(e.entity)}</b> ${esc(e.message)}${btns}`};
  }
  if (e.kind === "error") {
    return {cls: "err", ent: null,
      html: `<span class="r">decode error</span><span class="t">${t}</span><br>${esc(e.message)}`};
  }
  return {cls: "info", ent: null,
    html: `<span class="r">info</span><span class="t">${t}</span><br>${esc(e.message)}`};
}

function renderFeed() {
  const f = $("filter").value.trim().toLowerCase();
  const items = feed
    .filter(e => !f || [e.entity, e.rule, e.message, e.pack, e.state].join(" ").toLowerCase().includes(f))
    .slice(-500);
  $("alerts").innerHTML = items.map(e => {
    const {cls, ent, html} = entryHtml(e);
    return `<li class="${cls}" ${ent ? `data-ent="${esc(ent)}"` : ""}>${html}</li>`;
  }).reverse().join("");
  $("aCount").textContent = `${state ? state.alerts.length : 0} open · ${feed.length} events`;
}

const STATUS_COLOR = {live:"#3fb950", frozen:"#d29922", silent:"#d29922", deactivated:"#8b949e", removed:"#8b949e"};

// Selecting an entity highlights it everywhere, opens the detail panel and
// pans the map. Clicking it again (or Esc / the panel's close) deselects.
function selectEntity(id) {
  if (selected === id) return clearSelection();
  selected = id; detail = null;
  render(); updateMap(); fetchDetail();
  const row = document.querySelector(`#rows tr[data-id="${CSS.escape(id)}"]`);
  if (row) {
    const wrap = row.closest(".tablewrap");
    wrap.scrollTo({top: row.offsetTop - wrap.clientHeight / 2 + row.offsetHeight / 2, behavior:"smooth"});
  }
  const e = byId[id];
  if (mapReady && e) map.easeTo({center:[e.lon, e.lat], zoom: Math.max(map.getZoom(), 10)});
}
function clearSelection() {
  selected = null; detail = null;
  render(); updateMap();
}

let detail = null;
function fetchDetail() {
  if (!selected) return;
  const id = selected, e = byId[id];
  fetch(`/api/entity?ex=${e ? e.exercise : 0}&id=${encodeURIComponent(id)}`, auth())
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (selected === id) { detail = d; renderDetail(); } })
    .catch(() => {});
}
setInterval(fetchDetail, 1000);

const KIND = {0:"other",1:"platform",2:"munition",3:"life form",4:"environmental",5:"cultural feature",6:"supply",7:"radio",8:"expendable",9:"sensor/emitter"};
const DOMAIN = {0:"other",1:"land",2:"air",3:"surface",4:"subsurface",5:"space"};
const FORCE = {0:"other",1:"friendly",2:"opposing",3:"neutral"};
const DR = ["other","static","FPW","RPW","RVW","FVW","FPB","RPB","RVB","FVB"];
const fmtWhen = s => s ? new Date(s*1000).toLocaleTimeString() : "–";

function renderDetail() {
  const box = $("detail"), wrap = document.querySelector(".tablewrap");
  if (!selected) { box.hidden = true; wrap.classList.remove("short"); return; }
  box.hidden = false; wrap.classList.add("short");
  const e = byId[selected];
  if (!e) {
    box.innerHTML = `<div class="dh"><b class="id">${esc(selected)}</b><span class="gone">no longer in the entity table</span>`
      + `<span class="acts"><button class="albtn" data-act="events">show its events</button><button class="albtn" data-act="close">close</button></span></div>`;
    return;
  }
  const d = detail && detail.id === e.id ? detail : null;
  const st = statusOf(e), now = state ? state.at : 0;
  const kd = (e.ek === 1 ? DOMAIN[e.edom] : KIND[e.ek]) || "";
  const muted = d && d.muted_until > now;
  const row = (k, v) => `<div><span>${k}</span> ${v}</div>`;
  const alerts = (state ? state.alerts : []).filter(a => a.entity === e.id);
  let h = `<div class="dh"><b>${esc(e.marking) || "(no marking)"}</b><span class="id">${esc(e.id)}</span>`
    + `<span class="st" style="color:${STATUS_COLOR[st]}">${st}</span>`
    + (muted ? `<span class="st" style="color:var(--dim)">muted ${fmtAge(d.muted_until - now)}</span>` : "")
    + `<span class="acts"><button class="albtn" data-act="events">show its events</button>`
    + (muted ? `<button class="albtn" data-act="unmute">unmute</button>` : `<button class="albtn" data-act="mute">mute 5m</button>`)
    + `<button class="albtn" data-act="close">close</button></span></div>`;
  h += `<div class="grid">`
    + row("exercise", e.exercise)
    + row("type", `${esc(e.etype)} <span>${kd}</span>`)
    + row("force", `${e.force} <span>${FORCE[e.force] || ""}</span>`)
    + row("position", `${e.lat.toFixed(5)}, ${e.lon.toFixed(5)}`)
    + row("altitude", `${e.alt.toFixed(0)} m`)
    + row("heading", `${((e.heading % 360) + 360) % 360 | 0}°`)
    + row("speed", `${e.speed.toFixed(1)} m/s`)
    + row("last seen", `${fmtWhen(e.seen)} <span>${fmtAge(e.age || 0)} ago</span>`)
    + (d ? row("first seen", fmtWhen(d.first_seen)) : "")
    + (d ? row("dead reckoning", DR[d.dr] || d.dr) : "")
    + (d ? row("appearance", "0x" + (d.appearance >>> 0).toString(16).padStart(8, "0")) : "")
    + (d ? row("last sender", esc(d.last_source)) : row("senders", e.senders))
    + `</div>`;
  if (alerts.length) {
    h += `<h3>open alerts (${alerts.length})</h3>` + alerts.map(a => {
      const btns = a.ack ? `<span class="acked">· acked by ${esc(a.ack.by)}</span>`
        : `<button class="albtn" data-cmd="ack" data-rule="${esc(a.rule)}" data-ent="${esc(a.entity)}" data-ex="${e.exercise}">ack</button>`;
      return `<div class="al ${a.severity === "critical" ? "crit" : "warn"}"><b>${esc(a.rule)}</b> ${esc(a.message)} <span class="t">since ${fmtWhen(a.since)}</span>${btns}</div>`;
    }).join("");
  }
  if (d && d.sources) {
    h += `<h3>senders (${d.sources.length})</h3><table><thead><tr><th>address</th><th>reports</th><th>heartbeat</th><th>jitter</th><th>last</th><th>type</th></tr></thead><tbody>`
      + d.sources.map(s => `<tr class="${s.etype !== e.etype ? "conflict" : ""}"><td>${esc(s.addr)}</td><td>${s.reports}</td>`
        + `<td>${s.hb_mean ? s.hb_mean.toFixed(2) + " s" : "–"}</td><td>${s.hb_sd ? "±" + s.hb_sd.toFixed(2) + " s" : "–"}</td>`
        + `<td>${fmtAge(Math.max(0, now - s.seen))} ago</td><td>${esc(s.etype)}</td></tr>`).join("")
      + `</tbody></table>`;
  }
  box.innerHTML = h;
}

function statusOf(e) {
  if (e.removed) return "removed";
  if (e.deactivated) return "deactivated";
  if (e.stale) return "silent";
  if (e.frozen) return "frozen";
  return "live";
}

function render() {
  if (!state) return;
  const exIds = Object.keys(state.exercises);
  $("hEx").textContent = exIds.join(", ") || "–";
  const live = state.entities.filter(e => !e.removed && !e.stale).length;
  $("hEnt").textContent = live + " / " + state.entities.length;
  $("hRate").textContent = state.rates.pdu_1s.toFixed(1);
  $("hErr").textContent = state.totals.errors;
  $("hAlerts").textContent = state.alerts.length;
  $("hPacks").textContent = state.packs.join(" + ");
  const anyFrozen = exIds.some(id => state.exercises[id].frozen);
  $("hFrozen").innerHTML = anyFrozen ? '<span class="frozen">FROZEN</span>' : "";
  const ef = $("efilter").value.trim().toLowerCase();
  const rows = [...state.entities]
    .map(e => { e.age = Math.max(0, state.at - (e.seen || state.at)); e.status = statusOf(e); return e; })
    .filter(e => !ef || [e.id, e.marking, e.etype, e.force, e.exercise].join(" ").toLowerCase().includes(ef))
    .sort((a,b) => {
    let x = a[sortKey], y = b[sortKey];
    if (typeof x === "string") return sortAsc ? x.localeCompare(y) : y.localeCompare(x);
    return sortAsc ? x - y : y - x;
  });
  $("rows").innerHTML = rows.map(e => {
    const cls = e.removed ? "removed" : (e.stale ? "stale" : (e.frozen ? "frozen" : ""));
    const sel = selected === e.id ? " sel" : "";
    return `<tr class="${cls}${sel}" data-id="${esc(e.id)}">
      <td>${esc(e.id)}</td><td>${esc(e.marking)}</td><td>${esc(e.etype)}</td><td>${e.force}</td>
      <td>${e.lat.toFixed(4)}</td><td>${e.lon.toFixed(4)}</td>
      <td>${e.speed.toFixed(0)}</td><td>${fmtAge(e.age)}</td><td>${e.senders}</td>
      <td>${e.status}</td></tr>`;
  }).join("") || '<tr><td colspan="10" class="empty">waiting for traffic…</td></tr>';
  const tl = $("tlrow");
  if (state.replay) {
    tl.classList.add("on");
    $("seek").max = state.replay.dur;
    if (document.activeElement !== $("seek")) $("seek").value = state.replay.pos;
    $("seekt").textContent = fmtT(state.replay.pos);
    $("seekd").textContent = fmtT(state.replay.dur);
  } else tl.classList.remove("on");
  $("eCount").textContent = ef ? `${rows.length} / ${state.entities.length}` : state.entities.length;
  $("sidelist").innerHTML = rows.map(e =>
    `<li ${selected === e.id ? 'class="sel"' : ""} data-id="${esc(e.id)}"><span class="dot" style="background:${STATUS_COLOR[e.status]}"></span>${esc(e.marking)}<span class="id">${esc(e.id)}</span></li>`
  ).join("") || '<li class="empty">–</li>';
  renderFeed();
  renderDetail();
}

// --- map (MapLibre, offline Natural Earth basemap + MIL-STD-2525-ish symbols) ---
let map = null, mapReady = false;
const icons = new Set();

function graticule() {
  const features = [];
  for (let lon = -180; lon <= 180; lon += 10)
    features.push({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:[[lon,-85],[lon,85]]}});
  for (let lat = -80; lat <= 80; lat += 10)
    features.push({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:[[-180,lat],[180,lat]]}});
  return {type:"FeatureCollection", features};
}

const FORCE_COLOR = {1:"#58a6ff", 2:"#f85149", 3:"#3fb950"};
const forceColor = f => FORCE_COLOR[f] || "#d29922";

// Canvas-drawn icon: force frame (friendly box / hostile diamond / neutral
// square / other circle) around a platform glyph keyed on DIS kind+domain.
function makeIcon(k, d, f) {
  const c = document.createElement("canvas");
  c.width = c.height = 30;
  const x = c.getContext("2d"), m = 15;
  x.lineWidth = 2;
  x.strokeStyle = forceColor(f);
  x.fillStyle = "#0d1117cc";
  x.beginPath();
  if (f === 2) { x.moveTo(m,1); x.lineTo(29,m); x.lineTo(m,29); x.lineTo(1,m); x.closePath(); }      // diamond
  else if (f === 3) x.rect(3,3,24,24);                                                              // square
  else if (f === 1) x.rect(2,6,26,18);                                                              // rectangle
  else x.arc(m, m, 12, 0, 7);                                                                       // circle
  x.fill(); x.stroke();
  x.strokeStyle = x.fillStyle = "#e6edf3";
  x.lineWidth = 1.6;
  x.beginPath();
  if (k === 1 && d === 1) { x.rect(8,14,14,5); x.moveTo(19,16); x.lineTo(26,14); x.stroke(); }        // tank
  else if (k === 1 && d === 2) { x.moveTo(m,7); x.lineTo(22,22); x.lineTo(m,19); x.lineTo(8,22); x.closePath(); x.fill(); } // jet
  else if (k === 1 && d === 3) { x.moveTo(6,18); x.lineTo(24,18); x.lineTo(21,23); x.lineTo(9,23); x.closePath(); x.fill(); x.fillRect(12,10,6,7); } // ship
  else if (k === 1 && d === 4) { x.ellipse(m,16,9,5,0,0,7); x.stroke(); x.beginPath(); x.moveTo(m,11); x.lineTo(m,7); x.lineTo(m+4,7); x.stroke(); } // sub
  else if (k === 1 && d === 5) { x.fillRect(12,12,6,6); x.fillRect(5,13,6,4); x.fillRect(19,13,6,4); }           // satellite
  else if (k === 2) { x.moveTo(m,6); x.lineTo(18,20); x.lineTo(m,17); x.lineTo(12,20); x.closePath(); x.fill(); x.beginPath(); x.moveTo(12,20); x.lineTo(9,24); x.moveTo(18,20); x.lineTo(21,24); x.stroke(); } // missile
  else if (k === 3) { x.arc(m,9,3.5,0,7); x.fill(); x.beginPath(); x.moveTo(m,13); x.lineTo(m,22); x.stroke(); } // lifeform
  else { x.moveTo(m,9); x.lineTo(m,21); x.moveTo(9,m); x.lineTo(21,m); x.stroke(); }                             // other: cross
  // addImage takes ImageData, not a canvas (a canvas has no .data → "mismatched image size").
  return x.getImageData(0, 0, 30, 30);
}
function iconName(k, d, f) { return `s-${k}-${d}-${f}`; }

function initMap() {
  if (!window.maplibregl) return;
  map = new maplibregl.Map({
    container: "map",
    style: {version: 8, sources: {}, layers: [
      {id:"bg", type:"background", paint:{"background-color":"#142435"}},
    ]},
    center: [-121.9, 36.6], zoom: 9, attributionControl: {compact: true},
  });
  map.on("load", () => {
    map.addSource("countries", {type:"geojson", data:"/world.geojson"});
    map.addSource("coast", {type:"geojson", data:"/ne/coastline"});
    map.addSource("rivers", {type:"geojson", data:"/ne/rivers"});
    map.addSource("lakes", {type:"geojson", data:"/ne/lakes"});
    map.addSource("grat", {type:"geojson", data:graticule()});
    map.addSource("ents", {type:"geojson", data:{type:"FeatureCollection", features:[]}});
    map.addLayer({id:"countries", type:"fill", source:"countries",
      paint:{"fill-color":"#2d4156", "fill-outline-color":"#4a6478"}});
    map.addLayer({id:"lakes", type:"fill", source:"lakes", paint:{"fill-color":"#1b3048"}});
    map.addLayer({id:"grat", type:"line", source:"grat", paint:{"line-color":"#3a5068","line-width":0.5,"line-opacity":0.6}});
    map.addLayer({id:"coast", type:"line", source:"coast", paint:{"line-color":"#7ba0c4","line-width":1}});
    map.addLayer({id:"rivers", type:"line", source:"rivers", paint:{"line-color":"#3d6a9a","line-width":0.8}});
    map.addLayer({id:"entsel", type:"circle", source:"ents",
      filter:["==",["get","id"],""],
      paint:{"circle-radius":13,"circle-color":"#0000","circle-stroke-color":"#e6edf3","circle-stroke-width":2}});
    map.addLayer({id:"ents", type:"symbol", source:"ents",
      layout:{"icon-image":["concat","s-",["to-string",["get","k"]],"-",["to-string",["get","d"]],"-",["to-string",["get","f"]]],
        // No text-field: symbol text needs a style "glyphs" font source, which we
        // don't ship offline; the layer is rejected outright if it's present.
        "icon-allow-overlap":true}});
    map.on("click", "ents", ev => selectEntity(ev.features[0].properties.id));
    mapReady = true;
    updateMap();
  });
}
function updateMap() {
  if (!mapReady || !state) return;
  const feats = state.entities.filter(e => !e.removed).map(e => ({
    type:"Feature",
    geometry:{type:"Point", coordinates:[e.lon, e.lat]},
    properties:{id:e.id, marking:e.marking, st:statusOf(e), k:e.ek||0, d:e.edom||0, f:e.force||0},
  }));
  for (const ft of feats) {
    const p = ft.properties, name = iconName(p.k, p.d, p.f);
    if (!icons.has(name)) { map.addImage(name, makeIcon(p.k, p.d, p.f)); icons.add(name); }
  }
  map.getSource("ents").setData({type:"FeatureCollection", features:feats});
  map.setFilter("entsel", ["==",["get","id"], selected || ""]);
}

let byId = {};
function take(s) {
  if (s.type === "state") {
    if (!seeded) { for (const a of s.recent || []) pushEntry(a, true); seeded = true; }
    byId = {};
    for (const e of s.entities) byId[e.id] = e;
    state = s; render(); updateMap();
  } else if (s.type === "delta" && state) {
    for (const e of s.ents || []) byId[e.id] = e;
    for (const id of s.gone || []) delete byId[id];
    Object.assign(state, {at:s.at, uptime:s.uptime, clients:s.clients, totals:s.totals, rates:s.rates, exercises:s.exercises, alerts:s.alerts, replay:s.replay});
    state.entities = Object.values(byId);
    render(); updateMap();
  } else if (s.kind) pushEntry(s);
}

const tok = () => sessionStorage.nn_tok || "";
// Session token goes in a header, never in a URL (the WebSocket is the exception).
const auth = (opts = {}) => Object.assign({}, opts, {headers: Object.assign({authorization: "Bearer " + tok()}, opts.headers || {})});
function showLogin() { $("login").classList.add("on"); }
function signIn() {
  const u = $("luser").value, p = $("lpass").value;
  fetch("/api/login", {method:"POST", headers:{"content-type":"application/x-www-form-urlencoded"},
        body: "user=" + encodeURIComponent(u) + "&pass=" + encodeURIComponent(p)})
    .then(r => r.status === 200 ? r.json() : Promise.reject(r.status))
    .then(j => { sessionStorage.nn_tok = j.token; sessionStorage.nn_user = j.user; location.reload(); })
    .catch(() => $("lerr").textContent = "bad credentials");
}
$("lgo").onclick = signIn;
$("lpass").onkeydown = e => { if (e.key === "Enter") signIn(); };
if (tok()) { $("hUser").hidden = false; $("hWho").textContent = sessionStorage.nn_user || ""; }
$("logout").onclick = () => {
  fetch("/api/logout", auth({method:"POST"})).catch(() => {})
    .finally(() => { delete sessionStorage.nn_tok; delete sessionStorage.nn_user; location.reload(); });
};

let ws;
function connect() {
  try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?token=" + encodeURIComponent(tok())); }
  catch(e) { return poll(); }
  ws.onopen = () => { $("conn").className = "ws"; $("conn").textContent = "live"; };
  ws.onmessage = ev => { try { take(JSON.parse(ev.data)); } catch(e) {} };
  ws.onclose = () => {
    if ($("login").classList.contains("on")) return;
    $("conn").className = "down"; $("conn").textContent = "reconnecting…";
    // An expired session closes the socket too: ask before reconnecting.
    fetch("/api/state", auth()).then(r => r.status === 401 ? showLogin() : setTimeout(connect, 2000))
      .catch(() => setTimeout(connect, 2000));
  };
  ws.onerror = () => ws.close();
}
function poll() {
  $("conn").className = "poll"; $("conn").textContent = "polling";
  setInterval(() => fetch("/api/state", auth()).then(r => r.status === 401 ? showLogin() : r.json().then(take)).catch(() => {}), 2000);
}
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
  render();
});
// ack/mute buttons carry their command in data attributes (alert feed + detail panel).
function cmdButton(btn) {
  const o = {cmd: btn.dataset.cmd};
  if (btn.dataset.rule) o.rule = btn.dataset.rule;
  if (btn.dataset.ent) o.entity = btn.dataset.ent;
  if (btn.dataset.ex) o.exercise = +btn.dataset.ex;
  if (btn.dataset.secs) o.secs = +btn.dataset.secs;
  if (o.cmd === "ack") o.note = prompt("Note (optional):", "") || "";
  cmd(o);
}
$("alerts").onclick = ev => {
  const btn = ev.target.closest("button[data-cmd]");
  if (btn) { ev.stopPropagation(); cmdButton(btn); return; }
  const li = ev.target.closest("li[data-ent]");
  if (li && selected !== li.dataset.ent) selectEntity(li.dataset.ent);
};
$("rows").onclick = ev => {
  const tr = ev.target.closest("tr[data-id]");
  if (tr) selectEntity(tr.dataset.id);
};
$("sidelist").onclick = ev => {
  const li = ev.target.closest("li[data-id]");
  if (li) selectEntity(li.dataset.id);
};
$("detail").onclick = ev => {
  const btn = ev.target.closest("button");
  if (!btn || !selected) return;
  if (btn.dataset.cmd) return cmdButton(btn);
  const e = byId[selected], ex = e ? e.exercise : 0;
  switch (btn.dataset.act) {
    case "close": clearSelection(); break;
    case "events": $("filter").value = selected; renderFeed(); break;
    case "mute": cmd({cmd:"mute", entity:selected, exercise:ex, secs:300}); setTimeout(fetchDetail, 300); break;
    case "unmute": cmd({cmd:"unmute", entity:selected, exercise:ex}); setTimeout(fetchDetail, 300); break;
  }
};
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && selected && !$("login").classList.contains("on")) clearSelection(); });
$("filter").oninput = renderFeed;
$("efilter").oninput = render;
$("runsel").onchange = ev => cmd(ev.target.value ? {cmd:"replay", file:ev.target.value} : {cmd:"live"});
$("pspeed").onchange = ev => cmd({cmd:"speed", x:+ev.target.value});
$("seek").onchange = ev => cmd({cmd:"seek", to:+ev.target.value});
function loadRuns() {
  fetch("/api/runs", auth()).then(r => r.json()).then(d => {
    const sel = $("runsel"), cur = sel.value;
    sel.innerHTML = '<option value="">live</option>' +
      (d.runs || []).map(r => `<option value="${esc(r.name)}" ${r.name === cur ? "selected" : ""}>${esc(r.name)}</option>`).join("");
  }).catch(() => {});
}
loadRuns();
initMap();
fetch("/api/log?limit=500", auth()).then(r => {
  if (r.status === 401) { showLogin(); return; }
  r.json().then(d => (d.entries || []).forEach(e => pushEntry(e, true)));
  connect();
}).catch(() => connect());
</script>
