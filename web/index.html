<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetworkNinja</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --crit:#f85149; --warn:#d29922; --ok:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  header { display:flex; gap:1em; align-items:center; padding:.6em 1em; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:16px; letter-spacing:.5px; }
  .stat { color:var(--dim); } .stat b { color:var(--fg); }
  #conn.ws { color:var(--ok); } #conn.poll { color:var(--warn); } #conn.down { color:var(--crit); }
  .frozen { color:var(--warn); font-weight:600; }
  main { display:grid; grid-template-columns: 200px 1fr 380px; gap:1em; padding:1em; }
  #sidebar { grid-row:1/3; }
  #sidelist { list-style:none; margin:0; padding:0; font-size:12px; }
  #sidelist li { padding:.35em .6em; cursor:pointer; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sidelist li:hover { background:#21262d; }
  #sidelist li.sel { background:#1f6feb44; }
  #sidelist .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }
  #sidelist .id { color:var(--dim); font-size:10px; float:right; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } #sidebar { grid-row:auto; } #map { grid-column:1/-1; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  h2 { margin:0; padding:.6em .9em; font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); border-bottom:1px solid var(--line); }
  h2 span { float:right; font-weight:400; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:.35em .6em; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:11px; cursor:pointer; user-select:none; border-bottom:1px solid var(--line); }
  td { border-bottom:1px solid #21262d; }
  tbody tr.sel { background:#1f2d3d; }
  tr.stale td { color:var(--dim); }
  tr.removed td { color:var(--dim); text-decoration:line-through; }
  tr.frozen td:last-child { color:var(--warn); }
  ul#alerts { list-style:none; margin:0; padding:0; max-height:70vh; overflow-y:auto; }
  #alerts li { padding:.5em .9em; border-bottom:1px solid #21262d; cursor:pointer; font-size:13px; }
  #alerts li:hover { background:#1f2d3d; }
  #alerts li.crit { border-left:3px solid var(--crit); }
  #alerts li.warn { border-left:3px solid var(--warn); }
  #alerts li.res { border-left:3px solid var(--ok); opacity:.65; }
  #alerts li.err { border-left:3px solid var(--crit); background:#2d1f22; }
  #alerts li.info { border-left:3px solid var(--line); color:var(--dim); }
  #alerts .t { color:var(--dim); font-size:11px; }
  #alerts .r { color:var(--dim); font-size:11px; float:right; }
  .albtn { font-size:10px; padding:.1em .5em; margin-left:.5em; background:#21262d; color:var(--dim); border:1px solid var(--line); border-radius:3px; cursor:pointer; }
  .albtn:hover { color:var(--fg); border-color:var(--dim); }
  .acked { color:var(--ok); font-size:11px; }
  #filter, #efilter { width:100%; padding:.4em .9em; background:var(--bg); color:var(--fg); border:none; border-bottom:1px solid var(--line); outline:none; font:inherit; }
  #filter::placeholder, #efilter::placeholder { color:var(--dim); }
  .tablewrap { max-height:70vh; overflow:auto; }
  .empty { padding:1em; color:var(--dim); }
  #map { grid-column:2 / -1; height:420px; position:relative; }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>

<header>
  <b>NetworkNinja</b>
  <span id="conn" class="down">connecting…</span>
  <span class="stat">exercise <b id="hEx">–</b></span>
  <span class="stat">entities <b id="hEnt">0</b></span>
  <span class="stat">PDU/s <b id="hRate">0</b></span>
  <span class="stat">errors <b id="hErr">0</b></span>
  <span class="stat">alerts <b id="hAlerts">0</b></span>
  <span class="stat" id="hFrozen"></span>
  <span class="stat" style="margin-left:auto" id="hPacks"></span>
</header>

<main>
  <section id="sidebar">
    <h2>Entities</h2>
    <ul id="sidelist"></ul>
  </section>
  <section>
    <h2>Entities <span id="eCount"></span></h2>
    <input id="efilter" placeholder="search: id, marking, type, site…">
    <div class="tablewrap"><table>
      <thead><tr>
        <th data-k="id">ID</th><th data-k="marking">Marking</th><th data-k="etype">Type</th>
        <th data-k="force">Force</th><th data-k="lat">Lat</th><th data-k="lon">Lon</th>
        <th data-k="speed">m/s</th><th data-k="age">Age</th><th data-k="senders">Src</th><th>Status</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <section>
    <h2>Event log <span id="aCount"></span></h2>
    <input id="filter" placeholder="filter: entity, rule, message…">
    <ul id="alerts"></ul>
  </section>
  <section id="map"></section>
</main>
<script src="/vendor/maplibre-gl.js"></script>

<script>
"use strict";
let state = null, sortKey = "id", sortAsc = true, selected = null, seeded = false;
const $ = id => document.getElementById(id);
const seen = new Set();
const feed = [];

function fmtAge(a) { return a < 60 ? a.toFixed(0)+"s" : (a/60).toFixed(1)+"m"; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function pushEntry(e, silent) {
  const k = e.seq ?? (e.kind + "|" + e.at + "|" + (e.entity||"") + "|" + (e.rule||"") + "|" + (e.state||""));
  if (seen.has(k)) return;
  seen.add(k);
  feed.push(e);
  if (feed.length > 2000) feed.shift();
  renderFeed();
  if (!silent && e.kind === "alert" && e.state === "firing" && e.severity === "critical") {
    document.title = "⚠ NetworkNinja";
    setTimeout(() => document.title = "NetworkNinja", 5000);
  }
}

function cmd(o) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(o));
}

function entryHtml(e) {
  const t = new Date((e.at||0)*1000).toLocaleTimeString();
  if (e.kind === "alert") {
    const cls = e.state === "resolved" ? "res" : (e.severity === "critical" ? "crit" : "warn");
    const acked = e.state === "firing" && state && state.alerts.some(a => a.rule === e.rule && a.entity === e.entity && a.ack);
    const btns = e.state === "firing" && !acked
      ? `<button class="albtn" data-cmd="ack" data-rule="${esc(e.rule)}" data-ent="${esc(e.entity)}" data-ex="${e.exercise}">ack</button>`
        + `<button class="albtn" data-cmd="mute" data-ent="${esc(e.entity)}" data-ex="${e.exercise}" data-secs="300">mute 5m</button>`
      : "";
    const badge = acked ? ' <span class="acked">· acked</span>' : "";
    return {cls, ent: e.entity,
      html: `<span class="r">${esc(e.pack)}/${esc(e.rule)}</span><span class="t">${t} · ${e.state}${badge}</span><br><b>${esc(e.entity)}</b> ${esc(e.message)}${btns}`};
  }
  if (e.kind === "error") {
    return {cls: "err", ent: null,
      html: `<span class="r">decode error</span><span class="t">${t}</span><br>${esc(e.message)}`};
  }
  return {cls: "info", ent: null,
    html: `<span class="r">info</span><span class="t">${t}</span><br>${esc(e.message)}`};
}

function renderFeed() {
  const f = $("filter").value.trim().toLowerCase();
  const items = feed
    .filter(e => !f || [e.entity, e.rule, e.message, e.pack, e.state].join(" ").toLowerCase().includes(f))
    .slice(-500);
  $("alerts").innerHTML = items.map(e => {
    const {cls, ent, html} = entryHtml(e);
    return `<li class="${cls}" ${ent ? `data-ent="${esc(ent)}"` : ""}>${html}</li>`;
  }).reverse().join("");
  $("aCount").textContent = `${state ? state.alerts.length : 0} open · ${feed.length} events`;
}

const STATUS_COLOR = {live:"#3fb950", frozen:"#d29922", silent:"#d29922", deactivated:"#8b949e", removed:"#8b949e"};

function selectEntity(id) {
  selected = id;
  render();
  const row = document.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({block:"center", behavior:"smooth"});
  if (mapReady && state) {
    const e = state.entities.find(x => x.id === id);
    if (e) map.easeTo({center:[e.lon, e.lat], zoom: Math.max(map.getZoom(), 10)});
  }
}

function statusOf(e) {
  if (e.removed) return "removed";
  if (e.deactivated) return "deactivated";
  if (e.stale) return "silent";
  if (e.frozen) return "frozen";
  return "live";
}

function render() {
  if (!state) return;
  const exIds = Object.keys(state.exercises);
  $("hEx").textContent = exIds.join(", ") || "–";
  const live = state.entities.filter(e => !e.removed && !e.stale).length;
  $("hEnt").textContent = live + " / " + state.entities.length;
  $("hRate").textContent = state.rates.pdu_1s.toFixed(1);
  $("hErr").textContent = state.totals.errors;
  $("hAlerts").textContent = state.alerts.length;
  $("hPacks").textContent = state.packs.join(" + ");
  const anyFrozen = exIds.some(id => state.exercises[id].frozen);
  $("hFrozen").innerHTML = anyFrozen ? '<span class="frozen">FROZEN</span>' : "";
  const ef = $("efilter").value.trim().toLowerCase();
  const rows = [...state.entities]
    .filter(e => !ef || [e.id, e.marking, e.etype, e.force, e.exercise].join(" ").toLowerCase().includes(ef))
    .sort((a,b) => {
    let x = a[sortKey], y = b[sortKey];
    if (typeof x === "string") return sortAsc ? x.localeCompare(y) : y.localeCompare(x);
    return sortAsc ? x - y : y - x;
  });
  $("rows").innerHTML = rows.map(e => {
    const cls = e.removed ? "removed" : (e.stale ? "stale" : (e.frozen ? "frozen" : ""));
    const sel = selected === e.id ? " sel" : "";
    return `<tr class="${cls}${sel}" data-id="${esc(e.id)}" onclick="selectEntity('${e.id}')">
      <td>${e.id}</td><td>${esc(e.marking)}</td><td>${e.etype}</td><td>${e.force}</td>
      <td>${e.lat.toFixed(4)}</td><td>${e.lon.toFixed(4)}</td>
      <td>${e.speed.toFixed(0)}</td><td>${fmtAge(e.age)}</td><td>${e.senders}</td>
      <td>${statusOf(e)}</td></tr>`;
  }).join("") || '<tr><td colspan="10" class="empty">waiting for traffic…</td></tr>';
  $("eCount").textContent = ef ? `${rows.length} / ${state.entities.length}` : state.entities.length;
  $("sidelist").innerHTML = rows.map(e =>
    `<li ${selected === e.id ? 'class="sel"' : ""} onclick="selectEntity('${e.id}')"><span class="dot" style="background:${STATUS_COLOR[statusOf(e)]}"></span>${esc(e.marking)}<span class="id">${e.id}</span></li>`
  ).join("") || '<li class="empty">–</li>';
  renderFeed();
}

// --- map (MapLibre, offline Natural Earth basemap + MIL-STD-2525-ish symbols) ---
let map = null, mapReady = false;
const icons = new Set();

function graticule() {
  const features = [];
  for (let lon = -180; lon <= 180; lon += 10)
    features.push({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:[[lon,-85],[lon,85]]}});
  for (let lat = -80; lat <= 80; lat += 10)
    features.push({type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:[[-180,lat],[180,lat]]}});
  return {type:"FeatureCollection", features};
}

const FORCE_COLOR = {1:"#58a6ff", 2:"#f85149", 3:"#3fb950"};
const forceColor = f => FORCE_COLOR[f] || "#d29922";

// Canvas-drawn icon: force frame (friendly box / hostile diamond / neutral
// square / other circle) around a platform glyph keyed on DIS kind+domain.
function makeIcon(k, d, f) {
  const c = document.createElement("canvas");
  c.width = c.height = 30;
  const x = c.getContext("2d"), m = 15;
  x.lineWidth = 2;
  x.strokeStyle = forceColor(f);
  x.fillStyle = "#0d1117cc";
  x.beginPath();
  if (f === 2) { x.moveTo(m,1); x.lineTo(29,m); x.lineTo(m,29); x.lineTo(1,m); x.closePath(); }      // diamond
  else if (f === 3) x.rect(3,3,24,24);                                                              // square
  else if (f === 1) x.rect(2,6,26,18);                                                              // rectangle
  else x.arc(m, m, 12, 0, 7);                                                                       // circle
  x.fill(); x.stroke();
  x.strokeStyle = x.fillStyle = "#e6edf3";
  x.lineWidth = 1.6;
  x.beginPath();
  if (k === 1 && d === 1) { x.rect(8,14,14,5); x.moveTo(19,16); x.lineTo(26,14); x.stroke(); }        // tank
  else if (k === 1 && d === 2) { x.moveTo(m,7); x.lineTo(22,22); x.lineTo(m,19); x.lineTo(8,22); x.closePath(); x.fill(); } // jet
  else if (k === 1 && d === 3) { x.moveTo(6,18); x.lineTo(24,18); x.lineTo(21,23); x.lineTo(9,23); x.closePath(); x.fill(); x.fillRect(12,10,6,7); } // ship
  else if (k === 1 && d === 4) { x.ellipse(m,16,9,5,0,0,7); x.stroke(); x.beginPath(); x.moveTo(m,11); x.lineTo(m,7); x.lineTo(m+4,7); x.stroke(); } // sub
  else if (k === 1 && d === 5) { x.fillRect(12,12,6,6); x.fillRect(5,13,6,4); x.fillRect(19,13,6,4); }           // satellite
  else if (k === 2) { x.moveTo(m,6); x.lineTo(18,20); x.lineTo(m,17); x.lineTo(12,20); x.closePath(); x.fill(); x.beginPath(); x.moveTo(12,20); x.lineTo(9,24); x.moveTo(18,20); x.lineTo(21,24); x.stroke(); } // missile
  else if (k === 3) { x.arc(m,9,3.5,0,7); x.fill(); x.beginPath(); x.moveTo(m,13); x.lineTo(m,22); x.stroke(); } // lifeform
  else { x.moveTo(m,9); x.lineTo(m,21); x.moveTo(9,m); x.lineTo(21,m); x.stroke(); }                             // other: cross
  return c;
}
function iconName(k, d, f) { return `s-${k}-${d}-${f}`; }

function initMap() {
  if (!window.maplibregl) return;
  map = new maplibregl.Map({
    container: "map",
    style: {version: 8, sources: {}, layers: [
      {id:"bg", type:"background", paint:{"background-color":"#142435"}},
    ]},
    center: [-121.9, 36.6], zoom: 9, attributionControl: {compact: true},
  });
  map.on("load", () => {
    map.addSource("countries", {type:"geojson", data:"/world.geojson"});
    map.addSource("coast", {type:"geojson", data:"/ne/coastline"});
    map.addSource("rivers", {type:"geojson", data:"/ne/rivers"});
    map.addSource("lakes", {type:"geojson", data:"/ne/lakes"});
    map.addSource("grat", {type:"geojson", data:graticule()});
    map.addSource("ents", {type:"geojson", data:{type:"FeatureCollection", features:[]}});
    map.addLayer({id:"countries", type:"fill", source:"countries",
      paint:{"fill-color":"#2d4156", "fill-outline-color":"#4a6478"}});
    map.addLayer({id:"lakes", type:"fill", source:"lakes", paint:{"fill-color":"#1b3048"}});
    map.addLayer({id:"grat", type:"line", source:"grat", paint:{"line-color":"#3a5068","line-width":0.5,"line-opacity":0.6}});
    map.addLayer({id:"coast", type:"line", source:"coast", paint:{"line-color":"#7ba0c4","line-width":1}});
    map.addLayer({id:"rivers", type:"line", source:"rivers", paint:{"line-color":"#3d6a9a","line-width":0.8}});
    map.addLayer({id:"entsel", type:"circle", source:"ents",
      filter:["==",["get","id"],""],
      paint:{"circle-radius":13,"circle-color":"#0000","circle-stroke-color":"#e6edf3","circle-stroke-width":2}});
    map.addLayer({id:"ents", type:"symbol", source:"ents",
      layout:{"icon-image":["concat","s-",["to-string",["get","k"]],"-",["to-string",["get","d"]],"-",["to-string",["get","f"]]],
        "icon-allow-overlap":true,
        "text-field":["get","marking"],"text-size":10,"text-offset":[0,1.9]},
      paint:{"text-color":"#c9d1d9","text-halo-color":"#0d1117","text-halo-width":1.2}});
    map.on("click", "ents", ev => selectEntity(ev.features[0].properties.id));
    mapReady = true;
    updateMap();
  });
}
function updateMap() {
  if (!mapReady || !state) return;
  const feats = state.entities.filter(e => !e.removed).map(e => ({
    type:"Feature",
    geometry:{type:"Point", coordinates:[e.lon, e.lat]},
    properties:{id:e.id, marking:e.marking, st:statusOf(e), k:e.ek||0, d:e.edom||0, f:e.force||0},
  }));
  for (const ft of feats) {
    const p = ft.properties, name = iconName(p.k, p.d, p.f);
    if (!icons.has(name)) { map.addImage(name, makeIcon(p.k, p.d, p.f)); icons.add(name); }
  }
  map.getSource("ents").setData({type:"FeatureCollection", features:feats});
  map.setFilter("entsel", ["==",["get","id"], selected || ""]);
}

function take(s) {
  if (s.type === "state") {
    if (!seeded) { for (const a of s.recent || []) pushEntry(a, true); seeded = true; }
    state = s; render(); updateMap();
  } else if (s.kind) pushEntry(s);
}

let ws;
function connect() {
  try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"); }
  catch(e) { return poll(); }
  ws.onopen = () => { $("conn").className = "ws"; $("conn").textContent = "live"; };
  ws.onmessage = ev => { try { take(JSON.parse(ev.data)); } catch(e) {} };
  ws.onclose = () => { $("conn").className = "down"; $("conn").textContent = "reconnecting…"; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}
function poll() {
  $("conn").className = "poll"; $("conn").textContent = "polling";
  setInterval(() => fetch("/api/state").then(r => r.json()).then(take).catch(() => {}), 2000);
}
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
  render();
});
$("alerts").onclick = ev => {
  const btn = ev.target.closest("button[data-cmd]");
  if (btn) {
    ev.stopPropagation();
    const o = {cmd: btn.dataset.cmd};
    if (btn.dataset.rule) o.rule = btn.dataset.rule;
    if (btn.dataset.ent) o.entity = btn.dataset.ent;
    if (btn.dataset.ex) o.exercise = +btn.dataset.ex;
    if (btn.dataset.secs) o.secs = +btn.dataset.secs;
    if (o.cmd === "ack") o.note = prompt("Note (optional):", "") || "";
    cmd(o);
    return;
  }
  const li = ev.target.closest("li[data-ent]");
  if (li) selectEntity(li.dataset.ent);
};
$("filter").oninput = renderFeed;
$("efilter").oninput = render;
initMap();
fetch("/api/log?limit=500").then(r => r.json()).then(d => (d.entries || []).forEach(e => pushEntry(e, true))).catch(() => {});
connect();
</script>
