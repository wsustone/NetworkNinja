# NetworkNinja base DIS rule pack.
#
# Hand-authored subset of SISO-REF-010 enumerations covering the fields the
# decoder exposes (the six deep-decoded PDU types plus the common header).
# The full enumeration tables are generated from SISO-REF-010 later; until
# then this pack errs on the permissive side and sites widen or narrow it
# with layered packs (see ADR 0003 and docs/rule-packs.md).
#
# Layering: this pack is always loaded first, compiled into the binary;
# files passed with `nn-server --rulepack FILE` sit on top and may override
# thresholds, disable rules, or replace/disable enum checks by field.

[pack]
id = "dis-base"
name = "Base DIS rule pack"
version = 1
source = "IEEE 1278.1-2012 structure; SISO-REF-010 enumerations (hand-authored subset)"

[defaults]
# Seconds between repeats of the same enum violation on the same entity.
enum_repeat_seconds = 60.0
# How often time-based checks run, seconds.
tick_interval = 0.25

# --- Behavioural rules -----------------------------------------------------

[rules.entity-timeout]
# Expected Entity State interval and the timeout factor (IEEE 1278.1
# defaults: heartbeat every 5 s, time out after 12 s = 2.4x). Entity State
# Updates count as reports. A stationary entity (last report: DR algorithm
# Static, or no speed) may heartbeat at stationary_heartbeat instead
# (HBT_STATIONARY, 4.2.7), so it times out after 60 s x 2.4 = 144 s.
heartbeat = 5.0
stationary_heartbeat = 60.0
timeout_multiplier = 2.4
severity = "warning"

[rules.id-conflict]
# A second sender must still be reporting this long after the first sender
# arrived before it counts as a conflict (allows simulator restarts).
conflict_grace = 2.0
# Byte-identical PDUs from a second sender within this many seconds are a
# relay's copy (gateway, second NIC, both legs of a SPAN), not a conflict.
duplicate_window = 1.0
severity = "critical"

[rules.position-jump]
# tolerance = max(jump_min_tolerance, jump_dr_multiplier * assumed_dr_threshold)
#           + speed * jump_timing_slack, metres
jump_min_tolerance = 50.0
assumed_dr_threshold = 1.0
jump_dr_multiplier = 3.0
jump_timing_slack = 0.5
severity = "warning"

# --- Structure (ADR 0010 tier S) -------------------------------------------
# Every PDU's length is checked against its IEEE 1278.1 layout and the
# record counts it declares (crates/decode/src/structure.rs). Findings are
# point events that repeat at most every enum_repeat_seconds per rule, PDU
# type and sender, and cite the layout clause.

[rules.pdu-structure]
# Data missing or misdescribed: a count overruns the PDU, the datagram cuts
# it off, or a record's own length disagrees with its contents.
severity = "critical"

[rules.pdu-padding]
# Bytes the layout doesn't account for, or missing alignment padding. The
# data is readable, so some sites turn this off for known senders.
severity = "warning"

[rules.pdu-family]
# The Protocol Family field doesn't match the PDU type.
severity = "warning"

# --- Simulation Management handshakes (ADR 0010 step 5) --------------------

[rules.siman-handshake]
# A request to one specific simulation or entity (Create/Remove Entity,
# Start/Resume, Stop/Freeze, Action Request, Data Query, Set Data and the -R
# forms) must be answered within response_timeout seconds (TI_TIMER2_DFLT);
# an Acknowledge must carry the flag of the request it answers; and an
# Acknowledge or Action Response must answer some request.
response_timeout = 12.0
severity = "warning"

# --- Radio communications (ADR 0010 step 5) --------------------------------

[rules.radio]
# Transmitter heartbeat while its antenna moves (HBT_PDU_TRANSMITTER) and
# while it doesn't (HBT_STATIONARY); Receiver heartbeat (HBT_PDU_RECEIVER);
# a radio times out after heartbeat x timeout_multiplier (HBT_TIMEOUT_MPLIER).
transmitter_heartbeat = 2.0
stationary_heartbeat = 60.0
receiver_heartbeat = 5.0
timeout_multiplier = 2.4
# Seconds a radio may transmit with no Signal PDU before it looks stuck,
# and seconds Signals may trail the Transmitter PDU that ends a transmission.
idle_transmit = 30.0
signal_slack = 1.0
severity = "warning"

# --- Entity lifecycle (5.3.2, 5.3.5, 5.6.5.3) --------------------------------

[rules.entity-lifecycle]
# After a Remove Entity, the entity's simulation must send at least one more
# Entity State with appearance Deactivated, within final_report_window
# seconds; after that, no more. Also: DR algorithm Static with a speed, one
# sender changing an entity's type, force or marking mid-life, and Entity
# State Updates for an entity no full Entity State has described.
final_report_window = 12.0
severity = "warning"

# --- Fire and Detonation (5.4.3, 5.4.4) ------------------------------------

[rules.fire-detonation]
# A munition Fire's Detonation (same Event ID) is due within max_flight
# seconds; a munition Detonation should match a Fire (mines, demolitions and
# accidental detonations legitimately don't, so that finding names them); the
# pair must agree on firing entity and munition type; the PDU Status fire /
# detonation type indicator must agree with the descriptor's kind. Mines and
# demolitions (munition category Fixed) aren't fired. A Detonation with result
# Entity Impact must land within impact_tolerance metres (plus the target's
# speed x 1 s) of its target's dead-reckoned position.
max_flight = 180.0
impact_tolerance = 100.0
severity = "warning"

# --- Directed energy, damage status, collisions (5.4.5, 5.4.6, 5.3.3-4) -----

[rules.directed-energy]
# While a DE weapon is on (DE Fire Flags bit 0), DE Fire PDUs are due every
# de_heartbeat seconds (HBT_PDU_DE_FIRE) x the heartbeat multiplier; a single
# Fire follows the first DE Fire and a Detonation the final one (5.4.5.3).
# DE records are Precision (4000, 88 bytes) or Area (4001) Aimpoints.
de_heartbeat = 0.5
severity = "warning"

[rules.entity-damage]
# No Entity Damage Status after the entity's Deactivated report; a repaired
# report (no damage records) must be matched by an appearance without damage
# within repair_window seconds (5.4.6.3). Damage records are DE Damage
# Description records (4500, 40 bytes).
repair_window = 6.0
severity = "warning"

[rules.collision]
# Both parties to a collision report it, once per collision event, within
# collision_window seconds (COLLISION_ELASTIC_TIMEOUT); ENTITY_ID_UNKNOWN and
# objects that aren't entities in the exercise owe nothing (5.3.3.4, 5.3.4).
# A Collision needs one party moving faster than collision_speed m/s
# (COLLISION_THRSH, 5.3.3.2 c).
collision_window = 5.0
collision_speed = 0.1
severity = "warning"

[rules.attribute]
# Attribute PDU issuance (5.3.6.3): records match the Master Attribute Record
# Type (or it is MULTIPLES_PRESENT, 0); no empty record sets; a real PDU type
# and version; Coupled PDU Extension (PDU Status CEI) means the Attribute PDU
# follows in the same bundle and matches the PDU it extends; transient PDUs
# are only extended coupled.
severity = "warning"

# --- Electromagnetic emission (5.7.3) ---------------------------------------

[rules.emission]
# Each active emitter system (one with an active beam) sends an EE PDU at
# least every ee_heartbeat seconds (HBT_PDU_EE) x the heartbeat rule's
# timeout_multiplier, and goes quiet with one report of Deactivated beams. A
# system's Emitter Name and Function stay fixed; emitter and beam numbers
# aren't 0 or 255 and are unique; a beam lists at most high_density_threshold
# targets (EE_HIGH_DENSITY_THRSH) before High Density Track/Jam; continuous
# wave is PRF and pulse width both 0; Track/Jam targets are real entities; a
# Destroyed platform turns its emitters off.
ee_heartbeat = 5.0
high_density_threshold = 10.0
severity = "warning"

# --- Designator (5.7.4) -----------------------------------------------------

[rules.designator]
# A spot on no entity (D-SPOT_NO_ENTITY, 0:0:0) has no offset from it; a
# designated entity is one the exercise knows; a designator left on after its
# designating or designated entity ceases to exist owes a final Designator
# PDU with Power 0 within final_report_window seconds. (Its heartbeat, and
# Power 0 as final, are the heartbeat rule's.)
final_report_window = 12.0
severity = "warning"

# --- IFF (5.7.6, 7.6.5, Annex B) --------------------------------------------

[rules.iff]
# DIS v7. Layer 1's Information Layers name the layers present, in order;
# Mode 5 and Mode S capable types (Annex B tables) carry Layers 3 and 4 while
# on; Layer 2 has a Fundamental Parameter record; the Change Indicator marks
# the initial report, each change and the heartbeat after it; System On/Off
# agrees with System Mode; a system reports Off within final_window seconds
# (IFF_PDU_FINAL) after its entity is deactivated, removed or destroyed. (Its
# heartbeat, which continues while off, is the heartbeat rule's.)
final_window = 10.0
severity = "warning"

# --- Logistics (5.5, 7.4) ---------------------------------------------------

[rules.logistics]
# A resupply Service Request gets a Resupply Offer or Resupply Cancel from the
# supplier it names within response_timeout seconds (the standard sets none;
# the receiver re-asks every RESUP_REC_T1, 5 s); an offer gets a Resupply
# Received or Cancel within resupply_timeout (RESUP_SUP_T1); a Repair Complete
# gets a Repair Response within repair_response_timeout (REPAR_SUP_T2). Plus
# answers to nothing, supplies listed on a repair request, more received than
# offered, and a supplier's repair cancel answered with the wrong result.
response_timeout = 12.0
resupply_timeout = 60.0
repair_response_timeout = 12.0
severity = "warning"

# --- Transfer Ownership (5.9.4, 7.8.4) ---------------------------------------

[rules.transfer-ownership]
# A TO PDU asks for Unacknowledged service, for an Active entity not already
# in a transfer. Once the acquiring simulation's first Entity State is out,
# the divesting one stops within handover_window seconds (and id-conflict
# leaves that pair to this rule), the new owner keeps Entity Type and Marking,
# sets the Transferred Entity Indicator right and sends its ownership Event
# Report within report_timeout (TO_AUTO_RESPONSE_TIMER). A transaction that
# neither completes nor is cancelled within stall_timeout
# (TO_MAN_RESPONSE_TIMER) is stalled.
handover_window = 5.0
report_timeout = 5.0
stall_timeout = 120.0
severity = "warning"

# --- Heartbeats (IEEE 1278.1 4.2.7, Table 4) --------------------------------

[rules.heartbeat]
# An object (emitting entity, aggregate, minefield, process, live entity...)
# that stops sending a PDU type with a heartbeat for longer than heartbeat x
# timeout_multiplier. Seconds per type, at the standard's defaults; 0 turns a
# type off. Entity State, EE and the radio PDUs have their own rules above and
# below. A Designator with Power 0 and an Entity Damage Status with no damage
# records are final: nothing more is owed.
timeout_multiplier = 2.4
designator = 5.0                 # HBT_PDU_DESIGNATOR, while on
iff = 10.0                       # HBT_PDU_IFF, also while the system is off
underwater_acoustic = 180.0      # HBT_PDU_UA
sees = 180.0                     # HBT_PDU_SEES
aggregate_state = 30.0           # HBT_PDU_AGGREGATE_STATE
is_group_of = 5.0                # HBT_PDU_ISGROUPOF
minefield_state = 5.0            # HBT_PDU_MINEFIELD_STATE
environmental_process = 15.0     # HBT_PDU_ENVIRONMENTAL_PROCESS
gridded_data = 900.0             # HBT_PDU_GRIDDED_DATA
tspi = 30.0                      # HBT_PDU_TSPI
appearance = 60.0                # HBT_PDU_APPEARANCE
entity_damage_status = 10.0      # HBT_PDU_ENTITY_DAMAGE, while damaged
severity = "warning"

# --- Duplicate delivery ----------------------------------------------------

[rules.duplicate-delivery]
# The same datagram from the same sender twice within echo_window seconds is
# one send delivered twice: two of the monitor's listeners overlap (the
# message names them), or the network duplicates it (a loop, a sender on two
# paths, a gateway echoing it back). The copy is counted once either way.
# (Copies from a *different* sender are a relay's; see id-conflict
# duplicate_window.)
echo_window = 0.1
severity = "warning"

# --- Enumeration checks ----------------------------------------------------
# field:    a path from the registry (header.* applies to every PDU)
# allowed:  integer, "lo-hi" range, "a, b-c" list, or an array of those
# severity: warning (default) | critical | off

# Header (checked against every PDU). Protocol versions 1-7 are DIS v1
# through IEEE 1278.1-2012; 0 and 8+ are not assigned.
[[enum]]
field = "header.protocol_version"
allowed = "1-7"

# PDU types 1-72 and protocol families 0-13 are assigned in IEEE 1278.1-2012
# (docs/pdu-coverage.md). Experimental types and families (129-255) are
# flagged; allow them in a site pack if your simulators use them.
[[enum]]
field = "header.pdu_type"
allowed = "1-72"

[[enum]]
field = "header.protocol_family"
allowed = "0-13"

# Entity State.
[[enum]]
field = "entity-state.force_id"
allowed = "0-16"

[[enum]]
field = "entity-state.entity_type.kind"
allowed = "0-9"

[[enum]]
field = "entity-state.entity_type.domain"
allowed = "0-5"

[[enum]]
field = "entity-state.entity_type.country"
allowed = "0-999"

[[enum]]
field = "entity-state.entity_type.category"
allowed = "0-255"

[[enum]]
field = "entity-state.marking.character_set"
allowed = "0-1"

[[enum]]
field = "entity-state.dead_reckoning.algorithm"
allowed = "0-9"

[[enum]]
field = "entity-state.alternative_entity_type.kind"
allowed = "0-9"

[[enum]]
field = "entity-state.alternative_entity_type.domain"
allowed = "0-5"

[[enum]]
field = "entity-state.alternative_entity_type.country"
allowed = "0-999"

# Warfare. Munition types use the same kind/country ranges; munition domains
# (SISO UID 14) run to 12: anti-armor ... directed energy (12).
[[enum]]
field = "fire.descriptor.munition_type.kind"
allowed = "0-9"

[[enum]]
field = "fire.descriptor.munition_type.domain"
allowed = "0-12"

[[enum]]
field = "detonation.descriptor.munition_type.kind"
allowed = "0-9"

[[enum]]
field = "detonation.descriptor.munition_type.domain"
allowed = "0-12"

# Detonation result (0 = other, 1-6 = impact/proximity classes, more in v7).
[[enum]]
field = "detonation.result"
allowed = "0-20"

# Stop/Freeze: reason 0-8 (recess, termination, failure, ...); the frozen
# behaviour byte is a 3-bit field (run clock / transmit / process updates).
[[enum]]
field = "stop-freeze.reason"
allowed = "0-8"

[[enum]]
field = "stop-freeze.frozen_behavior"
allowed = "0-7"

# --- PDU capture tiers (ADR 0009) -----------------------------------------
# How much Entity State traffic `serve --capture FILE` keeps per entity type.
# type:      entity type prefix, kind first ("*" = any, "1.2" = air platforms)
# min_speed: applies only while the entity moves at least this fast (m/s)
# every:     seconds between kept reports per entity and sender;
#            0 = every PDU, "off" = none
# The highest matching min_speed wins (observed speed beats declared type),
# then the longest type prefix. Fire, Detonation, Start/Resume, Stop/Freeze
# and Remove Entity are always kept, and so is every report from an entity
# while it has an open alert. Undecoded PDU types are not captured.

[[capture]]
type = "*"          # anything not listed: static objects, unknown kinds
every = 30.0

[[capture]]
type = "*"          # any fast mover, whatever its declared type
min_speed = 50.0
every = 0

[[capture]]
type = "1.1"        # land platforms
every = 5.0

[[capture]]
type = "1.1"        # land platforms at speed
min_speed = 15.0
every = 1.0

[[capture]]
type = "1.2"        # air platforms
every = 0

[[capture]]
type = "1.3"        # surface
every = 5.0

[[capture]]
type = "1.4"        # subsurface
every = 5.0

[[capture]]
type = "1.5"        # space
every = 0

[[capture]]
type = "2"          # munitions
every = 0

[[capture]]
type = "3"          # life forms
every = 10.0
