[package]
name = "nn-server"
description = "NetworkNinja single binary: capture pipeline, WebSocket API and embedded dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nn-decode = { path = "../decode" }
nn-capture = { path = "../capture" }
nn-state = { path = "../state" }
nn-rules = { path = "../rules" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
nn-recorder = { version = "0.1.0", path = "../recorder" }

[dev-dependencies]
nn-generator = { path = "../generator" }
