[package]
name = "nn-server"
description = "NetworkNinja single binary: capture pipeline, WebSocket API and embedded dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nn-decode = { path = "../decode" }
nn-capture = { path = "../capture" }
nn-state = { path = "../state" }
nn-rules = { path = "../rules" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
nn-recorder = { version = "0.1.0", path = "../recorder" }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }

[dev-dependencies]
nn-generator = { path = "../generator" }
